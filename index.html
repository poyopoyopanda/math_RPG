<div id="equation-rpg" class="rpg">
<style>
#equation-rpg{background:#101827;color:#edf3ff;padding:16px;border-radius:16px;font-family:system-ui,-apple-system,sans-serif;max-width:1100px;margin:0 auto;box-sizing:border-box}
#equation-rpg *{box-sizing:border-box}#equation-rpg h2,#equation-rpg h3{margin:5px 0 12px}#equation-rpg button,#equation-rpg input{font:inherit}
#equation-rpg button{border:1px solid #465773;background:#26354d;color:#f5f8ff;border-radius:9px;padding:9px 12px;cursor:pointer}#equation-rpg button:hover{filter:brightness(1.15)}#equation-rpg button:disabled{opacity:.42;cursor:not-allowed}
#equation-rpg .nav{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}#equation-rpg .nav button.active{background:#6d5ce8;border-color:#a89cff}
#equation-rpg .panel{background:#182439;border:1px solid #31415c;border-radius:12px;padding:13px;margin:10px 0}#equation-rpg .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}#equation-rpg .stat{background:#202f47;padding:10px;border-radius:9px}#equation-rpg .muted{color:#aab9d2;font-size:.9em}#equation-rpg .bar{height:10px;background:#0b1220;border-radius:99px;overflow:hidden;margin:6px 0 10px}#equation-rpg .bar>i{display:block;height:100%;background:linear-gradient(90deg,#46d6c6,#648bff);width:0%;transition:width .2s}#equation-rpg .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}#equation-rpg .grow{flex:1}#equation-rpg .notice{min-height:24px;color:#ffd98c;margin:8px 0}#equation-rpg .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}#equation-rpg .card{background:#202f47;border:1px solid #3b4c68;border-radius:10px;padding:12px}#equation-rpg .card h3{font-size:1em}#equation-rpg .good{color:#7ce4b2}#equation-rpg .bad{color:#ff9b9b}#equation-rpg .enemy{font-size:1.15em;font-weight:700}#equation-rpg input[type=text],#equation-rpg input[type=number]{background:#0d1523;color:#fff;border:1px solid #53647e;border-radius:8px;padding:10px;min-width:0;max-width:100%}#equation-rpg .factory{display:flex;flex-wrap:wrap;align-items:end;gap:8px;min-height:115px;padding:12px;background:#0d1523;border-radius:10px;overflow:hidden}#equation-rpg .factoryBar{width:30px;min-width:18px;border-radius:6px 6px 2px 2px;position:relative;box-shadow:0 0 12px #ffffff12;border:1px solid #ffffff35;transition:height .2s}#equation-rpg .factoryBar span{position:absolute;bottom:calc(100% + 3px);left:50%;transform:translateX(-50%);font-size:10px;color:#d8e4ff;white-space:nowrap}#equation-rpg .factoryBar.base{background:linear-gradient(#7be6ff,#3279d8)}#equation-rpg .factoryBar.advanced{background:linear-gradient(#e1a4ff,#8556d9)}#equation-rpg .factoryBar.elite{background:linear-gradient(#ffe49b,#e28a32)}#equation-rpg .factoryBar.mythic{background:linear-gradient(#ff9fbd,#e84b79)}#equation-rpg .treeWrap{height:520px;position:relative;overflow:hidden;background:#0b1322;border:1px solid #35435b;border-radius:12px;touch-action:none}#equation-rpg #treeSvg{width:100%;height:100%;display:block;cursor:grab;user-select:none}#equation-rpg #treeSvg.dragging{cursor:grabbing}#equation-rpg .treeControls{position:absolute;top:8px;right:8px;display:flex;gap:5px;z-index:2}#equation-rpg .treeControls button{padding:6px 10px;background:#26354ddd}#equation-rpg .treeLegend{display:flex;gap:10px;flex-wrap:wrap;font-size:.82em;color:#bdc9dd;margin:8px 0}#equation-rpg .legendDot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}#equation-rpg .small{font-size:.86em}#equation-rpg .battleActions{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}#equation-rpg .danger{border-color:#8b4d60!important}#equation-rpg .center{text-align:center}#equation-rpg .footer{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:10px}
@media(max-width:600px){#equation-rpg{padding:10px}#equation-rpg .treeWrap{height:430px}#equation-rpg .factoryBar{width:23px}}
</style>
<h2>⚔️ 方程式バトルRPG</h2>
<div class="stats" id="topStats"></div>
<div class="nav" id="nav"></div>
<div id="screen"></div>
<div class="notice" id="notice" role="status"></div>
<div class="footer"><span class="muted">自動保存・オフライン生産は最大24時間</span><button id="saveBtn">💾 セーブ</button><button id="resetBtn" class="danger">データ初期化</button></div>
<script>
(()=>{
const root=document.getElementById('equation-rpg');
const $=id=>root.querySelector('#'+id);
const STORAGE='eqRPG_JL_v7';
const previousStorage='eqRPG_JL_v6';
const olderStorage='eqRPG_JL_v5';
const oldestStorage='eqRPG_JL_v4';
const enemies=[
 {id:'slime',name:'スライム',lv:1,hp:35,atk:5,exp:20,gold:10},
 {id:'golem',name:'ゴーレム',lv:20,hp:150,atk:13,exp:75,gold:50},
 {id:'shadow',name:'影の騎士',lv:40,hp:330,atk:22,exp:150,gold:100},
 {id:'dragon',name:'ドラゴン',lv:60,hp:700,atk:35,exp:300,gold:200},
 {id:'demon',name:'魔王',lv:100,hp:1600,atk:55,exp:700,gold:500}
];
const fresh=()=>({lv:1,exp:0,hp:100,mp:30,num:0,gold:150,materials:0,bars:[],nextBarId:1,wins:0,rebirth:0,points:0,skills:[],milestones:[],inventory:{},ownedGear:[],equippedGear:{weapon:null,armor:null,exp:null,mana:null},zeroStartApplied:true,last:Date.now(),treeUnlocked:['0,0'],treeSeen:[],maxSeenRadius:4});
function load(){let x=null;try{x=JSON.parse(localStorage.getItem(STORAGE))||JSON.parse(localStorage.getItem(previousStorage))||JSON.parse(localStorage.getItem(olderStorage))||JSON.parse(localStorage.getItem(oldestStorage))}catch(e){};const needsZeroReset=!!x&&!Object.prototype.hasOwnProperty.call(x,'zeroStartApplied');let p=x||fresh();const d=fresh();for(const k in d)if(p[k]===undefined)p[k]=d[k];if(!Array.isArray(p.bars))p.bars=[];if(!Array.isArray(p.treeUnlocked)||!p.treeUnlocked.length)p.treeUnlocked=['0,0'];if(!Array.isArray(p.treeSeen))p.treeSeen=[];if(!p.inventory||typeof p.inventory!=='object')p.inventory={};if(!Array.isArray(p.ownedGear))p.ownedGear=[];if(!p.equippedGear||typeof p.equippedGear!=='object')p.equippedGear={weapon:null,armor:null,exp:null,mana:null};for(const slot of ['weapon','armor','exp','mana'])if(p.equippedGear[slot]===undefined)p.equippedGear[slot]=null;p.materials=Math.max(0,Number(p.materials)||0);/* 旧セーブからの移行時に、初期数字だけを一度0へ補正する。以後は通常の進行を保持する。 */if(needsZeroReset)p.num=0;p.zeroStartApplied=true;return p}
let p=load(),page='home',enemy=null,enemyHP=0,q=null,noticeText='',noticeTimer=null,treeScale=1,treePan={x:0,y:0},drag=null,battleSettings={difficulty:'normal',category:'random'};
const fmt=n=>Number(n||0).toLocaleString('ja-JP',{maximumFractionDigits:1});
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const needExp=()=>Math.floor(50*Math.pow(p.lv,1.45));
const needNum=()=>Math.floor(100*Math.pow(p.lv,1.7));
const maxHP=()=>100+(p.lv-1)*8+p.rebirth*25;
const maxMP=()=>30+Math.floor((p.lv-1)*1.4)+p.rebirth*5;
const skillBonus=(type)=>{let v=0;for(const id of p.treeUnlocked){const n=parseNodeId(id);if(!n||id==='0,0')continue;const info=nodeInfo(n.q,n.r);if(info.type===type)v+=info.value}return v};
const milestoneBonus=(type)=>({idle:p.lv>=75?.35:p.lv>=10?.1:0,exp:p.lv>=100?.30:p.lv>=25?.15:0,power:p.lv>=50?.15:0}[type]||0);
const tierInfo=[{name:'基礎バー',cls:'base',base:.35,cost:5},{name:'強化バー',cls:'advanced',base:2.5,cost:250},{name:'精鋭バー',cls:'elite',base:15,cost:5000},{name:'神話バー',cls:'mythic',base:90,cost:100000}];
const passiveRate=()=>.25;
const rate=()=>((p.bars.length?p.bars.reduce((s,b)=>s+tierInfo[clamp(b.tier,0,3)].base*Math.pow(1.22,Math.max(0,b.level-1)),0):passiveRate())*(1+skillBonus('idle')+milestoneBonus('idle'))*(1+p.rebirth*.08));
const tierCost=i=>Math.floor(tierInfo[i].cost*Math.pow(1.45,p.bars.filter(b=>b.tier===i).length));
const difficultyInfo={easy:{label:'やさしい',mult:1,min:1,max:10},normal:{label:'普通',mult:1.25,min:5,max:30},hard:{label:'難しい',mult:1.65,min:10,max:60},expert:{label:'超難問',mult:2.2,min:20,max:100}};
const categoryNames={random:'ランダム',calc:'計算',linear:'方程式',function:'関数',probability:'確率',inequality:'不等式',sequence:'数列',trig:'三角比',calculus:'微積分'};
const gearItems=[
{id:'ironSword',name:'鉄の剣',price:100,slot:'weapon',bonus:.15,desc:'与えるダメージ +15%'},
{id:'magicSword',name:'魔導剣',price:800,slot:'weapon',bonus:.35,desc:'与えるダメージ +35%'},
{id:'travelerRobe',name:'旅人のローブ',price:150,slot:'armor',bonus:.10,desc:'受けるダメージを10%軽減'},
{id:'dragonArmor',name:'竜鱗の鎧',price:1000,slot:'armor',bonus:.25,desc:'受けるダメージを25%軽減'},
{id:'studentRing',name:'学徒の指輪',price:200,slot:'exp',bonus:.25,desc:'獲得EXP +25%'},
{id:'sageCrown',name:'賢者の冠',price:1500,slot:'exp',bonus:.60,desc:'獲得EXP +60%'},
{id:'manaAmulet',name:'節魔の護符',price:500,slot:'mana',bonus:1,desc:'魔法の消費MP −1'},
{id:'abyssOrb',name:'深淵の魔珠',price:1800,slot:'mana',bonus:2,desc:'魔法の消費MP −2'}
];
const equippedItem=slot=>gearItems.find(it=>it.id===p.equippedGear[slot])||null;
const gearDamageBonus=()=>equippedItem('weapon')?.bonus||0;
const gearDefenseBonus=()=>equippedItem('armor')?.bonus||0;
const gearExpBonus=()=>equippedItem('exp')?.bonus||0;
const gearMPCut=()=>equippedItem('mana')?.bonus||0;
const expMult=()=>1+skillBonus('exp')+milestoneBonus('exp')+p.rebirth*.05+gearExpBonus();
const powerMult=()=>1+skillBonus('power')+milestoneBonus('power')+p.rebirth*.08;
const damageMult=()=>powerMult()+gearDamageBonus();
const incomingDamage=()=>Math.max(1,Math.floor(enemy.atk*(1-gearDefenseBonus())/(1+skillBonus('defense')*5)));
const spellCost=type=>Math.max(1,Math.ceil(({fire:8,ice:6,thunder:15,heal:10}[type])/(1+skillBonus('magic')*4))-gearMPCut());
function save(markTime=false){if(markTime)p.last=Date.now();try{localStorage.setItem(STORAGE,JSON.stringify(p))}catch(e){} }
function notify(t){noticeText=t;$('notice').textContent=t;if(noticeTimer)clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>{$('notice').textContent=''},4200)}
function levelCheck(){let up=0,got=0;while(p.exp>=needExp()&&p.num>=needNum()&&p.lv<9999){p.exp-=needExp();p.num-=needNum();p.lv++;let materialGain=1+Math.floor(p.lv/10);p.materials+=materialGain;got+=materialGain;p.hp=Math.min(maxHP(),p.hp+18);p.mp=Math.min(maxMP(),p.mp+8);up++}if(up)notify(`レベルアップ！ Lv.${p.lv}。素材 +${got}（合計 ${p.materials}）`);p.hp=clamp(p.hp,0,maxHP());p.mp=clamp(p.mp,0,maxMP())}
function nav(){const items=[['home','🏠 ホーム'],['battle','⚔️ 戦闘'],['numbers','📊 数字生産'],['shop','🛒 ショップ'],['skills','🕸️ スキル網'],['rebirth','♻️ 転生']];$('nav').innerHTML=items.map(([id,t])=>`<button data-page="${id}" class="${page===id?'active':''}">${t}</button>`).join('');$('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()})}
function topStats(){$('topStats').innerHTML=`<div class="stat"><span class="muted">レベル</span><br><b>Lv.${p.lv}</b></div><div class="stat"><span class="muted">HP</span><br><b>${fmt(p.hp)} / ${fmt(maxHP())}</b></div><div class="stat"><span class="muted">MP</span><br><b>${fmt(p.mp)} / ${fmt(maxMP())}</b></div><div class="stat"><span class="muted">所持数字</span><br><b>${fmt(p.num)}</b></div><div class="stat"><span class="muted">素材</span><br><b>💠 ${fmt(p.materials)}</b></div><div class="stat"><span class="muted">ゴールド</span><br><b>🪙 ${fmt(p.gold)}</b></div><div class="stat"><span class="muted">毎秒生産</span><br><b>+${fmt(rate())}/秒</b></div>`}
function home(){let ex=needExp(),nu=needNum();return `<div class="panel"><h3>冒険者ステータス</h3><div id="expLabel">経験値：${fmt(p.exp)} / ${fmt(ex)}</div><div class="bar"><i id="expProgress" style="width:${clamp(p.exp/ex*100,0,100)}%"></i></div><div id="numLabel">次のレベルに必要な数字：${fmt(nu)}</div><div class="bar"><i id="numProgress" style="width:${clamp(p.num/nu*100,0,100)}%"></i></div><div class="muted">レベルアップには経験値と数字の両方が必要です。初期所持数字は0。初回開始時は数字0・ゴールド150。バー購入前は低速の基礎生産だけが動きます。レベルアップ時にはスキル網の高位ノードに使う素材も獲得します。</div></div><div class="panel"><h3>🏭 数字生産ライン</h3><div class="factory">${p.bars.slice(0,80).map(b=>{let t=tierInfo[clamp(b.tier,0,3)];return `<div class="factoryBar ${t.cls}" style="height:${clamp(25+b.level*8+b.tier*12,30,95)}px"><span>Lv${b.level}</span></div>`}).join('')||'バーがありません'}</div><p>稼働中：${p.bars.length} 本 / 生産：+${fmt(rate())} 数字/秒</p><button data-go="numbers">バーを購入・強化</button></div><div class="panel"><h3>📜 冒険の記録</h3><div>勝利数：${p.wins}　転生回数：${p.rebirth}　スキル網の解放数：${p.treeUnlocked.length}</div><p class="muted">敵を倒して経験値とゴールドを獲得し、スキル網を広げて強化しよう。</p><button data-go="battle">戦闘へ進む</button></div>`}
function numbers(){let next=p.bars.length+1;return `<div class="panel"><h3>🏭 バー生産工場</h3><p>バーを買うと工場に表示され、毎秒の数字生産量が増加します。高 tier のバーほど生産量が大きくなります。</p><div class="factory">${p.bars.slice(0,100).map(b=>{let t=tierInfo[clamp(b.tier,0,3)];return `<div class="factoryBar ${t.cls}" style="height:${clamp(25+b.level*8+b.tier*12,30,100)}px"><span>${t.name.replace('バー','')} Lv${b.level}</span></div>`}).join('')||'<span class="muted">まだバーはありません。数字を貯めて最初のバーを購入しよう。</span>'}</div><div class="stats"><div class="stat">バー本数<br><b>${p.bars.length}</b></div><div class="stat">毎秒生産<br><b>+${fmt(rate())}</b></div><div class="stat">レベルアップ素材<br><b>💠 ${fmt(p.materials)}</b></div><div class="stat">合計強化段階<br><b>${p.bars.reduce((s,b)=>s+b.level-1,0)}</b></div></div></div><div class="cards">${tierInfo.map((t,i)=>{let c=tierCost(i);return `<div class="card"><h3>${['🔹','🔷','🟠','💗'][i]} ${t.name}</h3><p>基本生産：+${fmt(t.base)}/秒</p><p>購入費用：${fmt(c)} 数字</p><p class="muted">同種を購入するほど費用上昇</p><button data-buybar="${i}" ${p.num<c?'disabled':''}>購入する</button></div>`}).join('')}</div><div class="panel"><h3>バーを強化</h3><p>全てのバーのレベルを1上げます。レベルが高いほど各バーの生産量が増えます。</p><p>費用：${fmt(upgradeCost())} 数字</p><button data-upgradebar ${!p.bars.length||p.num<upgradeCost()?'disabled':''}>全バーを強化</button></div>`}
function upgradeCost(){return Math.floor(80*Math.pow(1.5,p.bars.reduce((s,b)=>s+b.level-1,0)))}
function shop(){const slotNames={weapon:'武器',armor:'防具',exp:'経験装備',mana:'魔力装備'};return `<div class="panel"><h3>🛒 冒険者ショップ</h3><p>以前の装備ショップを復元しました。ゴールドで装備を購入し、各カテゴリにつき1つ装備できます。購入済みの装備は何度でも付け替えられます。</p><div class="stats"><div class="stat">所持ゴールド<br><b>🪙 ${fmt(p.gold)}</b></div><div class="stat">武器<br><b>${equippedItem('weapon')?.name||'未装備'}</b></div><div class="stat">防具<br><b>${equippedItem('armor')?.name||'未装備'}</b></div><div class="stat">経験装備<br><b>${equippedItem('exp')?.name||'未装備'}</b></div><div class="stat">魔力装備<br><b>${equippedItem('mana')?.name||'未装備'}</b></div></div></div><div class="cards">${gearItems.map(it=>{const owned=p.ownedGear.includes(it.id),equipped=p.equippedGear[it.slot]===it.id;return `<div class="card"><h3>🛡️ ${it.name}</h3><p>${it.desc}</p><p class="muted">カテゴリ：${slotNames[it.slot]}</p><p>価格：🪙 ${it.price}</p>${!owned?`<button data-buygear="${it.id}" ${p.gold<it.price?'disabled':''}>購入する</button>`:`<button data-equipgear="${it.id}" ${equipped?'disabled':''}>${equipped?'装備中':'装備する'}</button>`}</div>`}).join('')}</div><div class="panel"><h3>装備効果</h3><p>武器：攻撃魔法・正解攻撃のダメージ補正に反映。</p><p>防具：敵から受けるダメージを割合軽減。</p><p>経験装備：戦闘勝利時の獲得EXPに反映。</p><p>魔力装備：魔法の必要MPを固定値で軽減（最低1MP）。</p></div>`}

function battle(){if(!enemy){return `<div class="panel"><h3>⚔️ 戦闘準備</h3><p>敵を選ぶ前に、問題の難易度と出題形式を設定できます。難しい問題ほど正解時の攻撃倍率が高くなります。</p><div class="cards"><div class="card"><h3>🧠 問題の難易度</h3><select id="questionDifficulty" style="width:100%;background:#0d1523;color:#fff;border:1px solid #53647e;border-radius:8px;padding:10px"><option value="easy" ${battleSettings.difficulty==='easy'?'selected':''}>やさしい（攻撃倍率 ×1.0）</option><option value="normal" ${battleSettings.difficulty==='normal'?'selected':''}>普通（攻撃倍率 ×1.25）</option><option value="hard" ${battleSettings.difficulty==='hard'?'selected':''}>難しい（攻撃倍率 ×1.65）</option><option value="expert" ${battleSettings.difficulty==='expert'?'selected':''}>超難問（攻撃倍率 ×2.2）</option></select><p class="muted">難易度によって数値の範囲、計算段数、式の複雑さが変わります。ランダムでは全ジャンルから毎問抽選します。</p></div><div class="card"><h3>📚 出題ジャンル</h3><select id="questionCategory" style="width:100%;background:#0d1523;color:#fff;border:1px solid #53647e;border-radius:8px;padding:10px">${Object.entries(categoryNames).map(([k,v])=>`<option value="${k}" ${battleSettings.category===k?'selected':''}>${v}</option>`).join('')}</select><p class="muted">「ランダム」では計算・方程式・関数・確率・不等式・数列・三角比・微積分から毎問ランダムに出題します。</p></div></div></div><div class="panel"><h3>対戦相手</h3><div class="cards">${enemies.map(e=>`<div class="card"><h3>${e.name}</h3><p>必要Lv：${e.lv}</p><p>HP：${e.hp} / 攻撃：${e.atk}</p><p>報酬：EXP ${e.exp}・🪙 ${e.gold}</p><button data-enemy="${e.id}" ${p.lv<e.lv?'disabled':''}>${p.lv<e.lv?'レベル不足':'設定で挑戦'}</button></div>`).join('')}</div></div>`}
return `<div class="panel"><div class="row"><div class="grow"><div class="enemy">${enemy.name}</div><div class="muted">敵HP：${fmt(enemyHP)} / ${enemy.hp}</div><div class="bar"><i style="width:${clamp(enemyHP/enemy.hp*100,0,100)}%;background:linear-gradient(90deg,#ff7188,#d9345d)"></i></div></div><button id="leaveBattle">撤退</button></div><p class="muted">設定：${difficultyInfo[battleSettings.difficulty].label} ／ ${categoryNames[battleSettings.category]}　・正解攻撃倍率 ×${difficultyInfo[battleSettings.difficulty].mult}</p><h3>🧩 問題に答えて攻撃</h3><div class="panel"><b>${q?q.q:'問題を生成中…'}</b><form id="answerForm" class="row" style="margin-top:10px"><input id="answerInput" type="text" autocomplete="off" placeholder="答えを入力" required style="flex:1;min-width:120px"><button type="submit">回答して攻撃</button></form><p class="muted">分数は 1/2、小数は 0.5、平方根は √3/2 のように入力してください。</p></div><div class="battleActions"><button data-magic="fire" ${p.mp<8?'disabled':''}>🔥 火炎魔法 (MP 8)</button><button data-magic="ice" ${p.mp<6?'disabled':''}>❄️ 氷結魔法 (MP 6)</button><button data-magic="thunder" ${p.mp<15?'disabled':''}>⚡ 雷鳴魔法 (MP 15)</button><button data-magic="heal" ${p.mp<10||p.hp>=maxHP()?'disabled':''}>💚 回復魔法 (MP 10)</button></div><p class="muted">HP ${fmt(p.hp)}/${maxHP()}　MP ${fmt(p.mp)}/${maxMP()}　魔法威力補正 ×${powerMult().toFixed(2)}</p></div>`}
function makeQ(){
  const r=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
  const pick=a=>a[r(0,a.length-1)];
  const gcd=(x,y)=>y?gcd(y,x%y):Math.abs(x)||1;
  const frac=(n,d=1)=>{if(d<0){n=-n;d=-d}const g=gcd(Math.abs(n),Math.abs(d));n/=g;d/=g;return d===1?String(n):`${n}/${d}`};
  const diff=battleSettings.difficulty||'normal';
  const d=difficultyInfo[diff]||difficultyInfo.normal;
  const kind=battleSettings.category==='random'?r(0,7):({calc:0,linear:1,function:2,probability:3,inequality:4,sequence:5,trig:6,calculus:7}[battleSettings.category]??r(0,7));
  let a,b,c,ans,text;
  const lo=d.min,hi=d.max;
  switch(kind){
    case 0:{ // 四則演算。難易度で桁・演算数・括弧を変える
      if(diff==='easy'){
        a=r(1,20);b=r(1,12);const op=pick(['+','−','×','÷']);
        if(op==='+'){ans=a+b;text=`${a} + ${b} = ?`}
        else if(op==='−'){if(a<b)[a,b]=[b,a];ans=a-b;text=`${a} − ${b} = ?`}
        else if(op==='×'){a=r(2,12);b=r(2,10);ans=a*b;text=`${a} × ${b} = ?`}
        else{b=r(2,12);a=b*r(2,12);ans=a/b;text=`${a} ÷ ${b} = ?`}
      }else if(diff==='normal'){
        a=r(5,hi);b=r(2,Math.max(3,Math.floor(hi/2)));c=r(2,Math.max(3,Math.floor(hi/3)));const op=pick(['+','−','×','÷']);
        if(op==='+'){ans=a+b*c;text=`${a} + ${b} × ${c} = ?`}
        else if(op==='−'){ans=a+b-c;text=`${a} + ${b} − ${c} = ?`}
        else if(op==='×'){ans=(a+b)*c;text=`(${a} + ${b}) × ${c} = ?`}
        else{const den=r(2,9);const val=r(2,12);ans=val;text=`${val*den} ÷ ${den} = ?`}
      }else{
        a=r(10,hi);b=r(2,Math.max(3,Math.floor(hi/2)));c=r(2,Math.max(3,Math.floor(hi/3)));const op=pick(['+','−','×','÷']);
        if(op==='+'){let z=r(2,12);ans=a+b*z-c;text=`${a} + ${b} × ${z} − ${c} = ?`}
        else if(op==='−'){ans=(a+b)*c-a;text=`(${a} + ${b}) × ${c} − ${a} = ?`}
        else if(op==='×'){let z=r(2,8);ans=(a+b)*z;text=`(${a} + ${b}) × ${z} = ?`}
        else{let den=r(2,12),val=r(5,25);ans=val;text=`(${val*den} + ${den*2}) ÷ ${den} − 2 = ?`}
      }break;
    }
    case 1:{ // 一次方程式
      const maxCoef=diff==='easy'?8:diff==='normal'?18:diff==='hard'?35:60;
      a=r(2,maxCoef);b=r(1,maxCoef);c=r(diff==='easy'?1:2,diff==='easy'?12:Math.max(15,Math.floor(hi/2)));
      if(diff==='easy'){ans=c;text=`${a}x + ${b} = ${a*c+b} のとき、x = ?`}
      else if(diff==='normal'){let z=r(1,8);ans=c;text=`${a}(x + ${z}) − ${a*z} + ${b} = ${a*c+b} のとき、x = ?`}
      else if(diff==='hard'){let z=r(2,12),k=r(2,8);ans=c;text=`${a}(2x − ${z}) + ${k} = ${2*a*c-a*z+k} のとき、x = ?`}
      else{let z=r(2,15),k=r(2,12);ans=c;text=`${a}(3x + ${z}) − ${2*a}x + ${k} = ${a*c+a*z+k} のとき、x = ?`}
      break;
    }
    case 2:{ // 関数代入
      a=r(1,diff==='easy'?8:diff==='normal'?15:diff==='hard'?25:40);b=r(0,diff==='easy'?10:hi);c=r(1,diff==='easy'?8:diff==='normal'?15:hi);
      if(diff==='easy'){ans=a*a+b;text=`f(x) = x² + ${b} のとき、f(${a}) = ?`}
      else if(diff==='normal'){ans=a*a+b*a+c;text=`f(x) = x² + ${b}x + ${c} のとき、f(${a}) = ?`}
      else if(diff==='hard'){let z=r(1,10);ans=2*a*a-b*a+z;text=`f(x) = 2x² − ${b}x + ${z} のとき、f(${a}) = ?`}
      else{let z=r(1,8);ans=a*a*a+b*a*a+c*a+z;text=`f(x) = x³ + ${b}x² + ${c}x + ${z} のとき、f(${a}) = ?`}
      break;
    }
    case 3:{ // 確率
      const sides=diff==='easy'?6:diff==='normal'?r(6,10):diff==='hard'?r(8,16):r(12,24);
      a=r(1,sides);b=r(a,sides);let n=b-a+1,g=gcd(n,sides);ans=frac(n/g,sides/g);text=`${sides}面のサイコロを1回振る。${a}以上${b}以下が出る確率を既約分数で答えて（例 1/2）。`;break;
    }
    case 4:{ // 不等式
      a=r(2,diff==='easy'?12:diff==='normal'?25:diff==='hard'?50:100);b=r(1,diff==='easy'?12:diff==='normal'?25:diff==='hard'?50:100);c=r(1,diff==='easy'?12:diff==='normal'?25:diff==='hard'?50:100);
      if(diff==='easy'){ans=b;text=`x − ${b} > ${0} の解を x > ? の形で答えて`}
      else if(diff==='normal'){ans=c;text=`${a}x − ${a*c} > ${0} の解を x > ? の形で答えて`}
      else if(diff==='hard'){ans=c;text=`${a}(x − ${b}) + ${a*b} > ${a*c} の解を x > ? の形で答えて`}
      else{let z=r(2,10);ans=c;text=`${a}(2x − ${b}) − ${a*(2*c-b)} > ${0} の解を x > ? の形で答えて`}
      break;
    }
    case 5:{ // 等差数列
      a=r(1,diff==='easy'?10:diff==='normal'?30:diff==='hard'?60:100);b=r(2,diff==='easy'?10:diff==='normal'?30:diff==='hard'?60:100);c=r(1,diff==='easy'?8:diff==='normal'?15:hi);ans=a+(b-1)*c;text=`初項 ${a}、公差 ${c} の等差数列。第${b}項は？`;break;
    }
    case 6:{ // sin/cos/tan と三角比同士の四則演算
      const ratios=[
        {label:'sin(0°)',v:0,ans:'0'},{label:'sin(30°)',v:.5,ans:'1/2'},{label:'sin(45°)',v:Math.SQRT1_2,ans:'√2/2'},{label:'sin(60°)',v:Math.sqrt(3)/2,ans:'√3/2'},{label:'sin(90°)',v:1,ans:'1'},{label:'sin(150°)',v:.5,ans:'1/2'},
        {label:'cos(0°)',v:1,ans:'1'},{label:'cos(30°)',v:Math.sqrt(3)/2,ans:'√3/2'},{label:'cos(45°)',v:Math.SQRT1_2,ans:'√2/2'},{label:'cos(60°)',v:.5,ans:'1/2'},{label:'cos(90°)',v:0,ans:'0'},{label:'cos(180°)',v:-1,ans:'-1'},
        {label:'tan(0°)',v:0,ans:'0'},{label:'tan(30°)',v:Math.sqrt(3)/3,ans:'√3/3'},{label:'tan(45°)',v:1,ans:'1'},{label:'tan(60°)',v:Math.sqrt(3),ans:'√3'},{label:'tan(180°)',v:0,ans:'0'}
      ];
      if(diff==='easy'){
        const t=pick(ratios.slice(0,7));ans=frac(Math.round(t.v*2),2);text=`${t.label} の値は？（分数または整数で回答）`;
      }else{
        const simple=[{label:'sin(30°)',n:1,d:2},{label:'cos(60°)',n:1,d:2},{label:'sin(90°)',n:1,d:1},{label:'cos(0°)',n:1,d:1},{label:'tan(45°)',n:1,d:1},{label:'sin(0°)',n:0,d:1},{label:'cos(90°)',n:0,d:1},{label:'tan(0°)',n:0,d:1}];
        const x=pick(simple),y=pick(simple);const op=pick(['+','−','×','÷']);let n,den;
        if(op==='+'){n=x.n*y.d+y.n*x.d;den=x.d*y.d}
        else if(op==='−'){n=x.n*y.d-y.n*x.d;den=x.d*y.d}
        else if(op==='×'){n=x.n*y.n;den=x.d*y.d}
        else{if(y.n===0){y=simple[0]}n=x.n*y.d;den=x.d*y.n}
        if(den<0){den=-den;n=-n}ans=frac(n,den);text=`${x.label} ${op} ${y.label} = ?（既約分数または整数で回答）`;
        if(diff==='expert'&&Math.random()<.5){const t=pick(ratios);text=`${t.label} の値は？（整数・分数・√2/2・√3/2・√3/3・√3 などで回答）`;ans=t.ans}
      }break;
    }
    case 7:{ // 微積分。難易度ごとに微分・積分の複雑さを上げる
      if(diff==='easy'){
        a=r(1,8);b=r(0,10);ans=2*a+b;text=`微分：f(x) = x² + ${b}x のとき、f'(${a}) = ?`;
      }else if(diff==='normal'){
        a=r(1,10);b=r(1,10);ans=2*a+b;text=`微分：f(x) = x² + ${b}x + 3 のとき、f'(${a}) = ?`;
      }else if(diff==='hard'){
        a=r(1,10);b=r(1,8);c=r(1,8);ans=3*a*a+2*b*a+c;text=`微分：f(x) = x³ + ${b}x² + ${c}x のとき、f'(${a}) = ?`;
      }else{
        a=r(2,12);b=r(1,10);c=r(1,8);const mode=r(0,1);
        if(mode===0){ans=3*a*a+2*b*a+c;text=`微分：f(x) = x³ + ${b}x² + ${c}x − 7 のとき、f'(${a}) = ?`}
        else{ans=a*a*a+b*a*a+c*a;text=`定積分：∫₀^${a} (3x² + ${2*b}x + ${c}) dx = ?`}
      }break;
    }
  }
  return {q:text,a:String(ans)};
}
function normalize(s){return String(s).trim().replace(/[＝]/g,'=').replace(/[×]/g,'*').replace(/[÷]/g,'/').replace(/\s+/g,'').replace(/−/g,'-').replace(/。/g,'').toLowerCase()}
function equivalent(user,answer){let u=normalize(user),a=normalize(answer);if(u===a)return true;let fraction=/^-?\d+\/-?\d+$/.test(u)&&/^-?\d+\/-?\d+$/.test(a);if(fraction){let [un,ud]=u.split('/').map(Number),[an,ad]=a.split('/').map(Number);return un*ad===an*ud}if(/^[-+]?\d+(\.\d+)?$/.test(u)&&/^[-+]?\d+(\.\d+)?$/.test(a))return Math.abs(Number(u)-Number(a))<1e-8;return false}
function startBattle(id){let dc=$('questionDifficulty'),cc=$('questionCategory');if(dc)battleSettings.difficulty=dc.value;if(cc)battleSettings.category=cc.value;enemy=enemies.find(e=>e.id===id)||enemies[0];enemyHP=enemy.hp;q=makeQ();page='battle';render()}
function answer(v){if(!enemy||!q)return;if(equivalent(v,q.a)){let dmg=Math.floor((12+p.lv*2+p.rebirth*4)*damageMult()*difficultyInfo[battleSettings.difficulty].mult);enemyHP-=dmg;notify(`正解！ ${dmg} ダメージ！`);if(enemyHP<=0){win();return}}else{let dmg=incomingDamage();p.hp-=dmg;notify(`不正解。正解は ${q.a}。${dmg} ダメージを受けた。`);if(p.hp<=0){p.hp=1;enemy=null;q=null;page='home';save();render();notify('力尽きてしまった… HP1で撤退した。');return}}q=makeQ();save();render()}
function magic(type){if(!enemy)return;let cost=spellCost(type);if(p.mp<cost){notify('MPが足りません');return}p.mp-=cost;if(type==='heal'){let before=p.hp,amount=Math.floor((35+p.lv*3)*powerMult());p.hp=Math.min(maxHP(),p.hp+amount);let healed=p.hp-before;let incoming=incomingDamage();p.hp-=incoming;notify(`回復魔法！ HPを ${healed} 回復。その隙に敵から ${incoming} ダメージ！`);if(p.hp<=0){p.hp=1;enemy=null;q=null;page='home';save();render();notify('回復中に力尽きたため、HP1で撤退した。');return}q=makeQ()}else{let base={fire:35,ice:20,thunder:80}[type];let dmg=Math.floor((base+p.lv*2)*damageMult());enemyHP-=dmg;if(type==='ice')enemy.atk=Math.max(1,Math.floor(enemy.atk*.8));notify(`${{fire:'火炎魔法',ice:'氷結魔法',thunder:'雷鳴魔法'}[type]}！ ${dmg} ダメージ！`);if(enemyHP<=0){win();return}}save();render()}
function win(){p.wins++;let ex=Math.floor(enemy.exp*expMult()),g=enemy.gold;p.exp+=ex;p.gold+=g;p.hp=Math.min(maxHP(),p.hp+Math.floor(maxHP()*.15));p.mp=Math.min(maxMP(),p.mp+Math.floor(maxMP()*.2));let name=enemy.name;enemy=null;q=null;levelCheck();save();page='battle';render();notify(`${name}を撃破！ EXP +${ex}、ゴールド +${g}。`)}
// Skill web: axial hex grid. Nodes are created only near the explored area.
const dirs=[[1,0],[0,1],[-1,1],[-1,0],[0,-1],[1,-1]];
function parseNodeId(id){let a=String(id).split(',').map(Number);return a.length===2&&a.every(Number.isFinite)?{q:a[0],r:a[1]}:null}
function nodeId(q,r){return `${q},${r}`}
function distance(q,r){return (Math.abs(q)+Math.abs(r)+Math.abs(q+r))/2}
function nodeInfo(q,r){let d=distance(q,r);let types=['idle','power','exp','defense','magic'];let idx=((q*7+r*11)%types.length+types.length)%types.length;let type=d===0?'root':types[idx];let values={idle:.06,power:.05,exp:.06,defense:.04,magic:.04};let names={root:'起点',idle:'数字生産',power:'魔法威力',exp:'経験値',defense:'耐久力',magic:'魔力効率'};let icons={root:'✦',idle:'▰',power:'⚡',exp:'✧',defense:'⬡',magic:'◈'};let baseCost=d===0?0:Math.floor(120*Math.pow(1.48,d));let reqLv=d>=6?d*5:1;let reqMat=d>=6?Math.ceil((d-4)/2):0;return {d,type,value:values[type]||0,name:names[type]||'スキル',icon:icons[type]||'◇',cost:baseCost,reqLv,reqMat,desc:{root:'スキル網の起点。ここから隣接ノードを解放できます。',idle:'数字生産量 +6%',power:'攻撃魔法の威力 +5%',exp:'獲得経験値 +6%',defense:'戦闘で受けるダメージを軽減（最大効果は上限あり）',magic:'魔法の消費MPを少し軽減'}[type]}}
function isUnlocked(id){return p.treeUnlocked.includes(id)}
function adjacentUnlocked(q,r){return dirs.some(([dq,dr])=>isUnlocked(nodeId(q+dq,r+dr)))}
function discoveredNodes(){
// 解放済みノードと、その隣接ノードだけを表示する。さらに先は隣接ノードを購入して初めて現れる。
const seen=new Set(['0,0']);
for(const id of p.treeUnlocked){const z=parseNodeId(id);if(!z)continue;seen.add(id);for(const [dq,dr] of dirs)seen.add(nodeId(z.q+dq,z.r+dr));}
return [...seen].map(parseNodeId).filter(Boolean)
}
function skills(){return `<div class="panel"><h3>🕸️ 拡張型スキル網</h3><p>明るいノードは解放済み、暗いノードは未解放です。解放済みノードに隣接したノードを解放すると、そこからさらに網が無制限に広がります。基本ノードは数字だけで解放できますが、起点から距離6以上の高位ノードにはプレイヤーレベルとレベルアップ素材も必要です。</p><div class="treeLegend"><span><i class="legendDot" style="background:#42d9bf"></i>数字生産</span><span><i class="legendDot" style="background:#ffad64"></i>魔法威力</span><span><i class="legendDot" style="background:#7ea7ff"></i>経験値</span><span><i class="legendDot" style="background:#b9a0ff"></i>耐久力</span><span><i class="legendDot" style="background:#ff82b2"></i>魔力効率</span></div><div class="treeWrap" id="treeWrap"><div class="treeControls"><button id="zoomOut">−</button><button id="zoomReset">中央</button><button id="zoomIn">＋</button></div><svg id="treeSvg" viewBox="0 0 1000 600" aria-label="スキルツリー"><g id="treeWorld"></g></svg></div><p class="muted">マウスホイール／＋−でズーム、ドラッグで移動。スマホ・タブレットでは指でドラッグできます。</p><div id="nodeInfo" class="card"><b>ノードを選択</b><p class="muted">ノードをクリックすると詳細が表示されます。</p></div><div class="row" style="margin-top:10px"><button id="centerTree">表示を中央に戻す</button><span class="muted">解放済み：${p.treeUnlocked.length} ノード</span></div></div>`}
function treeRender(){const svg=$('treeSvg'),world=$('treeWorld');if(!svg||!world)return;const nodes=discoveredNodes();const spacing=74,cx=500,cy=300;let lines='';const set=new Set(nodes.map(n=>nodeId(n.q,n.r)));for(const n of nodes){for(const [dq,dr] of dirs){const id2=nodeId(n.q+dq,n.r+dr);if(!set.has(id2))continue;let x1=cx+spacing*(n.q+n.r/2),y1=cy+spacing*.866*n.r,x2=cx+spacing*(n.q+dq+(n.r+dr)/2),y2=cy+spacing*.866*(n.r+dr);if(id2>nodeId(n.q,n.r))lines+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#31415c" stroke-width="3"/>`}}
let circles='';for(const n of nodes){let id=nodeId(n.q,n.r),info=nodeInfo(n.q,n.r),un=isUnlocked(id),avail=!un&&adjacentUnlocked(n.q,n.r),x=cx+spacing*(n.q+n.r/2),y=cy+spacing*.866*n.r;let color={root:'#f8df87',idle:'#42d9bf',power:'#ffad64',exp:'#7ea7ff',defense:'#b9a0ff',magic:'#ff82b2'}[info.type]||'#9caac1';let fill=un?color:'#182439',stroke=un?'#ffffff':avail?color:'#526078',op=un?1:avail?.95:.55;circles+=`<g data-node="${id}" style="cursor:pointer;opacity:${op}"><circle cx="${x}" cy="${y}" r="${un?23:19}" fill="${fill}" fill-opacity="${un?.95:.75}" stroke="${stroke}" stroke-width="${avail?3:2}"/><text x="${x}" y="${y+5}" text-anchor="middle" font-size="17" fill="${un?'#102034':'#e6eeff'}" pointer-events="none">${info.icon}</text>${un?`<circle cx="${x+17}" cy="${y-16}" r="5" fill="#b7ffe2"/>`:''}</g>`}
world.innerHTML=lines+circles;applyTreeTransform();world.querySelectorAll('[data-node]').forEach(g=>g.addEventListener('click',e=>{if(drag&&drag.moved)return;selectNode(g.dataset.node)}));}
function applyTreeTransform(){let w=$('treeWorld');if(w)w.setAttribute('transform',`translate(${treePan.x} ${treePan.y}) translate(500 300) scale(${treeScale}) translate(-500 -300)`)}
function selectNode(id){const z=parseNodeId(id);if(!z)return;const info=nodeInfo(z.q,z.r),un=isUnlocked(id),avail=!un&&adjacentUnlocked(z.q,z.r),canLevel=p.lv>=info.reqLv,canMat=p.materials>=info.reqMat,canBuy=p.num>=info.cost;let req=`<p>距離：${info.d}　必要数字：${fmt(info.cost)}</p>`;if(info.reqLv>1||info.reqMat>0)req+=`<p>高位ノード条件：Lv.${info.reqLv} 以上 ／ 素材 💠 ${info.reqMat} 個（所持 ${p.materials}）</p>`;$('nodeInfo').innerHTML=`<h3>${info.icon} ${info.name} ${un?'（解放済み）':''}</h3><p>${info.desc}</p>${req}${!un&&avail?`<button id="unlockNode" ${(!canBuy||!canLevel||!canMat)?'disabled':''}>${!canBuy?'数字不足':!canLevel?'レベル不足':!canMat?'素材不足':'ノードを解放'}</button>`:!un?'<p class="muted">まず隣接するノードを解放してください。</p>':''}`;let b=$('unlockNode');if(b)b.onclick=()=>{if(p.num<info.cost||p.lv<info.reqLv||p.materials<info.reqMat||!adjacentUnlocked(z.q,z.r))return;p.num-=info.cost;p.materials-=info.reqMat;p.treeUnlocked.push(id);if(info.type==='defense')p.hp=Math.min(maxHP(),p.hp+10);save();treeRender();selectNode(id);topStats();notify(`${info.name}ノードを解放！`)};}
function setupTree(){const svg=$('treeSvg');if(!svg)return;treeRender();const zoom=(factor)=>{treeScale=clamp(treeScale*factor,.35,2.5);applyTreeTransform()};$('zoomIn').onclick=()=>zoom(1.2);$('zoomOut').onclick=()=>zoom(1/1.2);const reset=()=>{treeScale=1;treePan={x:0,y:0};applyTreeTransform()};$('zoomReset').onclick=reset;$('centerTree').onclick=reset;svg.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?1.12:1/1.12)},{passive:false});svg.addEventListener('pointerdown',e=>{if(e.target.closest('[data-node]'))return;drag={x:e.clientX,y:e.clientY,px:treePan.x,py:treePan.y,moved:false};svg.classList.add('dragging');svg.setPointerCapture(e.pointerId)});svg.addEventListener('pointermove',e=>{if(!drag)return;let dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>4)drag.moved=true;let rect=svg.getBoundingClientRect();treePan.x=drag.px+dx*1000/rect.width;treePan.y=drag.py+dy*600/rect.height;applyTreeTransform()});svg.addEventListener('pointerup',()=>{drag=null;svg.classList.remove('dragging')});svg.addEventListener('pointercancel',()=>{drag=null;svg.classList.remove('dragging')});}
function rebirth(){let req=100;return `<div class="panel"><h3>♻️ 転生システム</h3><p>レベル${req}で転生できます。レベル・経験値・数字・ゴールド・バーは初期化されますが、転生ボーナスとスキル網は維持されます。</p><div class="stats"><div class="stat">現在のレベル<br><b>Lv.${p.lv}</b></div><div class="stat">転生回数<br><b>${p.rebirth}</b></div><div class="stat">転生ボーナス<br><b>生産 +${p.rebirth*15}% / EXP +${p.rebirth*5}%</b></div></div><p>転生すると最大HP・MPと攻撃力も上がります。</p><button id="rebirthBtn" ${p.lv<req?'disabled':''}>${p.lv<req?'Lv.100で転生可能':'転生する'}</button></div>`}
function render(){topStats();nav();let s=$('screen');if(page==='home')s.innerHTML=home();else if(page==='numbers')s.innerHTML=numbers();else if(page==='shop')s.innerHTML=shop();else if(page==='battle')s.innerHTML=battle();else if(page==='skills')s.innerHTML=skills();else s.innerHTML=rebirth();bindScreen();if(page==='skills')setupTree()}
function bindScreen(){safebind('data-go',b=>{page=b.dataset.go;render()});safebind('data-buygear',b=>{const it=gearItems.find(x=>x.id===b.dataset.buygear);if(!it||p.gold<it.price||p.ownedGear.includes(it.id))return;p.gold-=it.price;p.ownedGear.push(it.id);p.equippedGear[it.slot]=it.id;save();render();notify(`${it.name}を購入し、装備した！`)});safebind('data-equipgear',b=>{const it=gearItems.find(x=>x.id===b.dataset.equipgear);if(!it||!p.ownedGear.includes(it.id))return;p.equippedGear[it.slot]=it.id;save();render();notify(`${it.name}を装備した！`)});safebind('data-buybar',b=>{let tier=Number(b.dataset.buybar),info=tierInfo[tier],cost=tierCost(tier);if(p.num<cost)return;p.num-=cost;p.bars.push({id:p.nextBarId++,tier,level:1});save();render();notify(`${info.name}を購入！ 生産ラインに追加された。`)});safebind('data-upgradebar',()=>{let c=upgradeCost();if(!p.bars.length||p.num<c)return;p.num-=c;p.bars.forEach(b=>b.level++);save();render();notify('全バーを強化しました！')});safebind('data-enemy',b=>startBattle(b.dataset.enemy));safebind('data-magic',b=>magic(b.dataset.magic));let form=$('answerForm');if(form)form.onsubmit=e=>{e.preventDefault();let input=$('answerInput');answer(input.value)};let leave=$('leaveBattle');if(leave)leave.onclick=()=>{enemy=null;q=null;page='battle';render()};let rb=$('rebirthBtn');if(rb)rb.onclick=()=>{if(p.lv<100)return;if(!confirm('転生しますか？ レベル・数字・ゴールド・バーがリセットされます。'))return;p.rebirth++;p.lv=1;p.exp=0;p.num=0;p.gold=0;p.materials=0;p.bars=[];p.nextBarId=1;p.hp=maxHP();p.mp=maxMP();enemy=null;q=null;save();page='home';render();notify('転生完了！ 永続ボーナスを獲得しました。')}}
function safebind(selector,fn){root.querySelectorAll(`[${selector}]`).forEach(b=>b.onclick=()=>fn(b))}
$('saveBtn').onclick=()=>{save(true);notify('セーブしました。')};window.addEventListener('pagehide',()=>save(true));$('resetBtn').onclick=()=>{if(!confirm('セーブデータを初期化しますか？ この操作は元に戻せません。'))return;try{localStorage.removeItem(STORAGE);localStorage.removeItem(previousStorage);localStorage.removeItem(olderStorage);localStorage.removeItem(oldestStorage)}catch(e){}p=fresh();enemy=null;q=null;page='home';save();render();notify('データを初期化しました。')};
// Offline production (maximum 24 hours).
const now=Date.now(),elapsed=Math.max(0,Math.min(86400,(now-(p.last||now))/1000));if(elapsed>2){p.num+=elapsed*rate();levelCheck();notify(`オフライン生産：${fmt(elapsed)}秒分、数字 +${fmt(elapsed*rate())}`)}p.last=now;save();render();
let last=Date.now();setInterval(()=>{
  let n=Date.now(),dt=Math.max(0,Math.min(5,(n-last)/1000));last=n;if(dt<=0)return;
  // 生産は表示中のページに関係なく進み、上部ステータスも毎秒更新する。
  p.num+=rate()*dt;levelCheck();topStats();
  if(page==='home'){const ex=needExp(),nu=needNum();const el=$('expLabel'),ep=$('expProgress'),nl=$('numLabel'),np=$('numProgress');if(el)el.textContent=`経験値：${fmt(p.exp)} / ${fmt(ex)}`;if(ep)ep.style.width=`${clamp(p.exp/ex*100,0,100)}%`;if(nl)nl.textContent=`次のレベルに必要な数字：${fmt(nu)}`;if(np)np.style.width=`${clamp(p.num/nu*100,0,100)}%`;}
  save()
},1000);
})();
</script>
